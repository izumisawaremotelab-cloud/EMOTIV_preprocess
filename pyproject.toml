[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperscan-eeg"
version = "0.1.0"
description = "Two-person EEG hyperscanning preprocessing and inter-brain synchrony analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mne>=1.6",
    "mne-connectivity>=0.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "xarray>=2023.1",
    "matplotlib>=3.7",
    "PyQt5>=5.15; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.7", "ruff>=0.4"]

[project.scripts]
hyperscan-preprocess = "hyperscan_eeg.cli:preprocess_main"
hyperscan-analyze = "hyperscan_eeg.cli:analyze_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
